<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Default (fallback) meta - will be replaced dynamically -->
  <title>Loading place details — The P2V</title>
  <meta name="description" content="Discover this place on The P2V — interactive map & travel details." />
  <link rel="canonical" href="https://thep2v.com/" id="canonical-link" />

  <!-- OpenGraph / Twitter (dynamic) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="" id="og-title" />
  <meta property="og:description" content="" id="og-desc" />
  <meta property="og:image" content="" id="og-img" />
  <meta property="og:url" content="" id="og-url" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="" id="tw-title" />
  <meta name="twitter:description" content="" id="tw-desc" />
  <meta name="twitter:image" content="" id="tw-img" />

  <!-- Core styles + Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="/css/style.min.css" />
  <style>
    /* small page-specific styles */
    body { margin:0; font-family: Arial, sans-serif;background: #9da8b9; color:#0b3b3b; }
    .container { max-width:1100px; margin:18px auto; padding: 0 16px; }
    #map { height:320px; border-radius:10px; overflow:hidden; margin-top:12px; }
    .meta-block { display:flex; gap:12px; align-items:flex-start; margin:12px 0; flex-wrap:wrap; }
    .place-title { font-size:22px; font-weight:700; margin:8px 0; }
    .place-desc { font-size:15px; line-height:1.48; color:#1a2b2b; margin-bottom:8px; }
    .btn { background:#00A3A3; color:#fff; border:none; padding:8px 12px; border-radius:8px; cursor:pointer; font-weight:700; }
    .small { font-size:13px; color:#666; }
    .nearby-list { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
    a.back { display:inline-block; margin-top:8px; color:#007a7a; text-decoration:none; }
  </style>

  <!-- Firebase compat SDK (same as your site) -->
  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-firestore-compat.js"></script>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body>
  <div class="container">
    <a class="back" href="/">← All tourist places new me</a>
    <div id="place-main">
      <h1 class="place-title" id="place-name">Loading…</h1>
      <div class="meta-block">
        <div style="flex:1;">
          <p class="place-desc" id="place-desc">Please wait while we load details for this place.</p>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <button id="open-maps" class="btn">Get Directions</button>
            <button id="share-btn" class="btn">Share</button>
            <span class="small" id="place-loc"></span>
          </div>
        </div>
        <div style="width:320px;">
          <div id="map"></div>
        </div>
      </div>

      <h3 style="margin-top:18px;">Nearby places</h3>
      <div id="nearby" class="nearby-list small">Loading nearby...</div>
    </div>
  </div>

  <script>
    // ---------- Helper: turn CountryState into country + region ----------
    function normalizeLocationFromCountryState(countryStateRaw) {
      const raw = (countryStateRaw || "").trim();
      let country = "";
      let region = "";

      if (!raw) {
        return { country, region };
      }

      // "Karnataka(India)" → country = India, region = Karnataka
      const indiaMatch = raw.match(/^(.*)\(India\)$/i);
      if (indiaMatch) {
        region = indiaMatch[1].trim();
        country = "India";
      } else if (raw.toLowerCase() === "goa") {
        // special case: plain "Goa" → region in India
        country = "India";
        region = "Goa";
      } else {
        // otherwise treat whole thing as country (USA, France, Austria, Pakistan, etc.)
        country = raw;
        region = "";
      }

      return { country, region };
    }

    // ---------- SEO: BreadcrumbList schema for a single place ----------
    function injectBreadcrumbSchemaForPlace(place) {
      if (!place) return;

      const name = place.Name || "Place";
      const slug =
        place.slug ||
        (name || "")
          .toLowerCase()
          .trim()
          .replace(/\s+/g, "-")
          .replace(/[^a-z0-9\-]/g, "");

      const loc = normalizeLocationFromCountryState(place.CountryState);
      const country = loc.country;
      const region = loc.region;

      // remove previous if any
      const old = document.getElementById("p2v-breadcrumb-jsonld");
      if (old) old.remove();

      const base = location.origin.replace(/\/+$/, ""); // https://thep2v.com

      const items = [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": base + "/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Places",
          "item": base + "/places"
        }
      ];

      if (country) {
        const countrySlug = country.toLowerCase().trim().replace(/\s+/g, "-");
        items.push({
          "@type": "ListItem",
          "position": items.length + 1,
          "name": country,
          "item": base + "/places/" + countrySlug
        });

        if (region) {
          const regionSlug = region.toLowerCase().trim().replace(/\s+/g, "-");
          items.push({
            "@type": "ListItem",
            "position": items.length + 1,
            "name": region,
            "item": base + "/places/" + countrySlug + "/" + regionSlug
          });
        }
      }

      items.push({
        "@type": "ListItem",
        "position": items.length + 1,
        "name": name,
        "item": base + "/place/" + encodeURIComponent(slug)
      });

      const breadcrumb = {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": items
      };

      const script = document.createElement("script");
      script.id = "p2v-breadcrumb-jsonld";
      script.type = "application/ld+json";
      script.textContent = JSON.stringify(breadcrumb);
      document.head.appendChild(script);
    }


  (function() {
    // ---------- CONFIG: copy from your firebase setup ----------
    const firebaseConfig = {
      apiKey: "AIzaSyD7_JcaiWu0nOTSwIwPkPaoYprh_YNXryc",
      authDomain: "ptv-data-25e29.firebaseapp.com",
      projectId: "ptv-data-25e29",
      storageBucket: "ptv-data-25e29.firebasestorage.app",
      messagingSenderId: "955391224203",
      appId: "1:955391224203:web:4b62267d8404647a90678e",
      measurementId: "G-YE5X3MP1PN"
    };
    // ---------- end config ----------
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // helper to safely update meta tags and title
    function setMeta(id, value) {
      try {
        const el = document.getElementById(id);
        if (el) el.setAttribute('content', value);
      } catch(e) {}
    }
    function setText(id, txt) {
      const el = document.getElementById(id);
      if (el) el.textContent = txt || '';
    }

    // Parse slug: support /place/slug (via rewrite) OR ?slug=...
    function readSlug() {
      // prefer query param first
      const q = new URLSearchParams(location.search).get('slug');
      if (q) return q;
      // fallback: extract last pathname segment (useful for /place/slug)
      const parts = location.pathname.split('/').filter(Boolean);
      if (parts.length >= 2 && parts[0] === 'place') return parts.slice(1).join('/');
      return null;
    }

    const slug = readSlug();
    if (!slug) {
      setText('place-name','Place not found');
      setText('place-desc','No slug provided.');
      return;
    }

    // Query Firestore by slug
    db.collection('places').where('slug','==',slug).limit(1).get()
      .then(snapshot => {
        if (snapshot.empty) {
          setText('place-name','Place not found');
          setText('place-desc','We could not find information for "' + slug + '"');
          return;
        }
        const doc = snapshot.docs[0];
        const data = doc.data();

        const title = data.seo_title || data.Name || slug;
        const description = data.seo_description || data.seo_short || ('Explore ' + (data.Name || slug));
        const image = data.og_image || data.image || (location.origin + '/icons/og-preview.png');
        const permalink = data.permalink || (location.origin + '/place/' + encodeURIComponent(slug));
        const lat = parseFloat(data.Latitude);
        const lon = parseFloat(data.Longitude);

        // Update visible content
        setText('place-name', data.Name || title);
        setText('place-desc', description);
        setText('place-loc', (data.CountryState ? data.CountryState + ' • ' : '') + (data.Popularity ? data.Popularity : '') );

        // Update meta tags
        document.title = title;
        // update description meta tag
        const descEl = document.querySelector('meta[name="description"]');
        if (descEl) descEl.setAttribute('content', description);
        // canonical
        const canonical = document.getElementById('canonical-link') || document.createElement('link');
        canonical.setAttribute('rel','canonical');
        canonical.setAttribute('href', permalink);
        canonical.id = 'canonical-link';
        if (!document.getElementById('canonical-link')) document.head.appendChild(canonical);
        injectBreadcrumbSchemaForPlace(data);

        // OG / Twitter
        setMeta('og-title', title);
        setMeta('og-desc', description);
        setMeta('og-img', image);
        setMeta('og-url', permalink);

        setMeta('tw-title', title);
        setMeta('tw-desc', description);
        setMeta('tw-img', image);

        // set meta tags' content attributes directly for non-id'd meta tags (safeguard)
        const ogTitle = document.querySelector('meta[property="og:title"]');
        if (ogTitle) ogTitle.setAttribute('content', title);
        const ogDesc = document.querySelector('meta[property="og:description"]');
        if (ogDesc) ogDesc.setAttribute('content', description);

        // JSON-LD structured data (WebPage / Travel)
        const jsonLd = {
          "@context": "https://schema.org",
          "@type": "TouristDestination",
          "name": data.Name || title,
          "description": description,
          "url": permalink,
          "geo": {
            "@type": "GeoCoordinates",
            "latitude": lat || undefined,
            "longitude": lon || undefined
          },
          "address": {
            "@type": "PostalAddress",
            "addressLocality": data.CountryState || ''
          }
        };
        const ld = document.createElement('script');
        ld.type = 'application/ld+json';
        ld.id = 'dynamic-jsonld';
        ld.text = JSON.stringify(jsonLd);
        document.head.appendChild(ld);

        // Initialize a small map (Leaflet)
        const map = L.map('map', { zoomControl: true, attributionControl: false }).setView([lat || 20, lon || 77], lat ? 12 : 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        if (!isNaN(lat) && !isNaN(lon)) {
          const marker = L.marker([lat, lon]).addTo(map);
          marker.bindPopup((data.Name || title)).openPopup();
        }

        // Share button
        document.getElementById('share-btn').addEventListener('click', async () => {
          const url = permalink;
          const text = (data.Name ? (data.Name + ' — ') : '') + 'Found on The P2V';
          try {
            if (navigator.share) {
              await navigator.share({ title: title, text: text, url });
            } else if (navigator.clipboard && navigator.clipboard.writeText) {
              await navigator.clipboard.writeText(url);
              alert('Link copied to clipboard!');
            } else {
              window.prompt('Copy this link:', url);
            }
          } catch (e) {
            console.warn('share error', e);
            window.prompt('Copy this link:', url);
          }
        });

        // Get directions button
        document.getElementById('open-maps').addEventListener('click', () => {
          if (!isNaN(lat) && !isNaN(lon)) {
            const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}`;
            window.open(mapsUrl, '_blank', 'noopener,noreferrer');
          } else {
            alert('Coordinates not available for this place.');
          }
        });

        // Nearby: simple nearest 5 (in-memory)
        // ---------- Nearby: optimized pure-distance (quickselect + partial sort) ----------
        (function() {
          const K_NEAREST = 6; // number of nearby places to show

          // Haversine distance (km)
          function haversine(lat1, lon1, lat2, lon2) {
            const toRad = x => (x * Math.PI) / 180;
            if (
              lat1 == null || lon1 == null ||
              lat2 == null || lon2 == null ||
              isNaN(lat1) || isNaN(lon1) ||
              isNaN(lat2) || isNaN(lon2)
            ) return Infinity;
            const R = 6371;
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
          }

          // Quickselect partition
          function partition(arr, left, right, pivotIndex) {
            const pivotValue = arr[pivotIndex].d;
            // swap pivot to end
            [arr[pivotIndex], arr[right]] = [arr[right], arr[pivotIndex]];
            let storeIndex = left;
            for (let i = left; i < right; i++) {
              if (arr[i].d < pivotValue) {
                [arr[storeIndex], arr[i]] = [arr[i], arr[storeIndex]];
                storeIndex++;
              }
            }
            // move pivot to its final place
            [arr[right], arr[storeIndex]] = [arr[storeIndex], arr[right]];
            return storeIndex;
          }

          // Quickselect: rearranges so that element at k is the k-th smallest; elements < k are on the left
          function quickselect(arr, left, right, k) {
            while (true) {
              if (left === right) return;
              // choose pivot as median-of-three for a bit more stability
              let mid = left + Math.floor((right - left) / 2);
              let pivotIndex = medianOfThreeIndex(arr, left, mid, right);
              pivotIndex = partition(arr, left, right, pivotIndex);
              if (k === pivotIndex) {
                return;
              } else if (k < pivotIndex) {
                right = pivotIndex - 1;
              } else {
                left = pivotIndex + 1;
              }
            }
          }

          // median-of-three helper (by .d)
          function medianOfThreeIndex(arr, a, b, c) {
            const A = arr[a].d, B = arr[b].d, C = arr[c].d;
            if ((A <= B && B <= C) || (C <= B && B <= A)) return b;
            if ((B <= A && A <= C) || (C <= A && A <= B)) return a;
            return c;
          }

          // render result array (expects [{p: placeObj, d: distance}, ...])
          function renderNearbyList(sortedList) {
            const nearbyEl = document.getElementById('nearby');
            nearbyEl.innerHTML = '';
            if (!sortedList.length) {
              nearbyEl.textContent = 'No nearby places found.';
              return;
            }
            sortedList.forEach(it => {
              const el = document.createElement('div');
              const link = document.createElement('a');
              const slug = it.p.slug || (it.p.Name || '').toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9\-]/gi,'');
              link.href = '/place/' + encodeURIComponent(slug);
              link.textContent = it.p.Name || 'Unknown';
              link.style.color = '#007a7a';
              link.style.textDecoration = 'none';
              el.appendChild(link);
              if (isFinite(it.d)) {
                const span = document.createElement('span');
                span.style.marginLeft = '8px';
                span.style.color = '#666';
                span.textContent = ' • ' + (it.d === Infinity ? '-' : it.d.toFixed(1) + ' km');
                el.appendChild(span);
              }
              nearbyEl.appendChild(el);
            });
          }

          // Main: get places, compute distances, quickselect top K, sort top K, render
          db.collection('places').get().then(allSnap => {
            try {
              const all = allSnap.docs.map(d => d.data());
              // compute distances only once and filter badly formatted items
              const distances = [];
              const lat0 = parseFloat(lat);
              const lon0 = parseFloat(lon);

              for (let i = 0; i < all.length; i++) {
                const p = all[i];
                const plat = parseFloat(p.Latitude);
                const plon = parseFloat(p.Longitude);

                // skip same place by slug or exact coords
                if ((p.slug && p.slug === slug) || (!isNaN(plat) && !isNaN(plon) && Math.abs(plat - lat0) < 1e-8 && Math.abs(plon - lon0) < 1e-8)) {
                  continue;
                }

                const d = haversine(lat0, lon0, plat, plon);
                // if no coords, distance becomes Infinity and will be ignored later
                distances.push({ p: p, d: d });
              }

              if (!distances.length) {
                renderNearbyList([]);
                return;
              }

              // if count <= K, just sort and render
              if (distances.length <= K_NEAREST) {
                distances.sort((a,b) => a.d - b.d);
                renderNearbyList(distances.slice(0, K_NEAREST));
                return;
              }

              // Quickselect to get the K-th smallest distance into position K-1
              const kIndex = Math.min(K_NEAREST, distances.length) - 1;
              quickselect(distances, 0, distances.length - 1, kIndex);

              // Now distances[0..kIndex] contains the k nearest (unordered). Sort those.
              const topK = distances.slice(0, kIndex + 1).sort((a,b) => a.d - b.d);

              // render the top K (if any had Infinity distances, they'll float to end)
              renderNearbyList(topK);

            } catch (err) {
              console.error('Nearby quickselect error', err);
              // fallback to previous safe method: full sort
              db.collection('places').get().then(snap => {
                const list = snap.docs.map(d => d.data()).map(p => ({
                  p, d: haversine(parseFloat(lat), parseFloat(lon), parseFloat(p.Latitude), parseFloat(p.Longitude))
                })).sort((a,b) => a.d - b.d).slice(0, K_NEAREST);
                renderNearbyList(list);
              });
            }
          }).catch(err => {
            console.error('Nearby fetch error', err);
            const nearbyEl = document.getElementById('nearby');
            nearbyEl.innerHTML = '<div class="small">Unable to load nearby places.</div>';
          });
        })();


        // Inform crawlers (optional) - send GA event (if gtag exists)
        try { gtag && gtag('event','place_page_view',{event_label: slug}); } catch(e) {}

      })
      .catch(err => {
        console.error('place load error', err);
        setText('place-name','Error loading place');
        setText('place-desc','There was an error loading this place. Try again later.');
      });

  })();
  </script>
</body>
</html>
