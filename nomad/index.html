<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nomad AI — The P2V</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:        #0b0f18;
      --surface:   #131926;
      --card:      #1a2233;
      --border:    #242f42;
      --accent:    #00c8c8;
      --accent2:   #00e5cc;
      --text:      #dce6f5;
      --muted:     #7a90ab;
      --user-bg:   #00a8a8;
      --user-text: #001a1a;
      --error-bg:  #2a1520;
      --error-txt: #f87171;
      --radius:    16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    .shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 10px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      font-size: 13px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .back-btn:hover { border-color: var(--accent); }

    .header-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .header-badge {
      font-size: 11px;
      background: rgba(0,200,200,0.12);
      color: var(--accent);
      border: 1px solid rgba(0,200,200,0.25);
      padding: 3px 8px;
      border-radius: 20px;
    }

    .loc-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .loc-bar.active { color: var(--accent); }
    .loc-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .loc-bar.active .loc-dot {
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }
    .chat::-webkit-scrollbar { width: 4px; }
    .chat::-webkit-scrollbar-track { background: transparent; }
    .chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg {
      display: flex;
      gap: 10px;
      animation: rise 0.25s ease;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      flex-direction: row-reverse;
      align-self: flex-end;
      max-width: 82%;
    }
    .msg.assistant { align-self: flex-start; width: 100%; }

    .avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .msg.user .avatar      { background: var(--user-bg); }
    .msg.assistant .avatar { background: var(--card); border: 1px solid var(--border); }

    .msg-wrap {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }
    .msg.assistant .msg-wrap { width: calc(100% - 44px); }

    .bubble {
      padding: 13px 16px;
      border-radius: var(--radius);
      font-size: 14.5px;
      line-height: 1.75;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .msg.user .bubble {
      background: var(--user-bg);
      color: var(--user-text);
      border-bottom-right-radius: 4px;
    }

    .msg.assistant .bubble {
      background: var(--card);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }

    .bubble p { margin: 0 0 10px; color: #cad6ea; }
    .bubble p:last-child { margin-bottom: 0; }

    .bubble h3 {
      color: var(--accent);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.3px;
      margin: 18px 0 8px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--border);
    }
    .bubble h3:first-child { margin-top: 0; }

    .bubble ul, .bubble ol {
      padding-left: 0;
      margin: 6px 0 14px;
      list-style: none;
    }
    .bubble li {
      position: relative;
      padding-left: 18px;
      margin-bottom: 9px;
      color: #c8d8ee;
      line-height: 1.7;
    }
    .bubble ul li::before {
      content: '›';
      position: absolute;
      left: 0;
      color: var(--accent);
      font-weight: 700;
      font-size: 16px;
      line-height: 1.5;
    }
    .bubble ol { counter-reset: item; }
    .bubble ol li { counter-increment: item; }
    .bubble ol li::before {
      content: counter(item) '.';
      position: absolute;
      left: 0;
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.7;
    }

    .bubble strong { color: #a8f0f0; font-weight: 600; }
    .bubble em { color: #b8cce8; font-style: italic; }
    .bubble code {
      font-family: 'DM Mono', monospace;
      background: rgba(0,200,200,0.1);
      color: var(--accent2);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
    }

    .place-link {
      color: var(--accent2);
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px dotted rgba(0,229,204,0.4);
      transition: color 0.15s, border-color 0.15s;
    }
    .place-link:hover { color: #fff; border-color: #fff; }

    .copy-btn {
      align-self: flex-end;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      transition: 0.15s;
    }
    .copy-btn:hover { border-color: var(--accent); color: var(--accent); }

    .typing {
      display: flex;
      gap: 5px;
      padding: 14px 16px;
    }
    .typing span {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: bob 1.3s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.18s; }
    .typing span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes bob {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-8px); opacity: 1; }
    }

    .starters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 4px 0;
    }
    .starter {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px 14px;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      transition: border-color 0.2s, background 0.2s;
    }
    .starter:hover { border-color: var(--accent); background: #1e2a3d; }
    .starter .s-icon  { font-size: 20px; margin-bottom: 6px; display: block; }
    .starter .s-title { font-size: 13px; font-weight: 600; color: var(--accent); display: block; margin-bottom: 2px; }
    .starter .s-desc  { font-size: 12px; color: var(--muted); line-height: 1.4; }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 12px 16px 14px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    #user-input {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 11px 14px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      resize: none;
      max-height: 120px;
      transition: border-color 0.2s;
      line-height: 1.5;
    }
    #user-input::placeholder { color: var(--muted); }
    #user-input:focus { outline: none; border-color: var(--accent); }

    .send-btn {
      width: 42px; height: 42px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #001a1a;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s, background 0.15s;
    }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .send-btn:not(:disabled):hover { background: var(--accent2); transform: scale(1.05); }

    .error-msg {
      background: var(--error-bg);
      border: 1px solid rgba(248,113,113,0.3);
      color: var(--error-txt);
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 13px;
    }

    @media (max-width: 380px) {
      .starters { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="shell">

  <div class="header">
    <div class="header-left">
      <a href="/" class="back-btn">← Back</a>
      <span class="header-title">🧭 Nomad</span>
      <span class="header-badge">AI</span>
    </div>
    <button id="clear-btn" class="back-btn">🗑 Clear</button>
  </div>

  <div class="loc-bar" id="loc-bar">
    <div class="loc-dot"></div>
    <span id="loc-text">Getting your location…</span>
  </div>

  <div class="chat" id="chat">

    <div class="msg assistant">
      <div class="avatar">🧭</div>
      <div class="msg-wrap">
        <div class="bubble">
          <p>Hi! I'm <strong>Nomad</strong> — your AI travel companion for The P2V.</p>
          <p>I can help you discover nearby attractions, hidden gems, local activities, food spots, and smart travel plans.</p>
          <p style="font-size:13px; opacity:0.7; margin-bottom:0">I have access to 1,000+ places in our database and real-world travel knowledge.</p>
        </div>
      </div>
    </div>

    <div class="starters" id="starters">
      <button class="starter" data-prompt="What are the best places to visit near me?">
        <span class="s-icon">🗺️</span>
        <span class="s-title">Places Near Me</span>
        <span class="s-desc">Discover top attractions nearby</span>
      </button>
      <button class="starter" data-prompt="Plan a weekend trip within 100km of my location">
        <span class="s-icon">🎒</span>
        <span class="s-title">Weekend Trip</span>
        <span class="s-desc">Get a curated itinerary</span>
      </button>
      <button class="starter" data-prompt="What outdoor activities can I do near me?">
        <span class="s-icon">🏞️</span>
        <span class="s-title">Activities</span>
        <span class="s-desc">Beyond tourist spots</span>
      </button>
      <button class="starter" data-prompt="Show me hidden gems that most tourists miss near me">
        <span class="s-icon">💎</span>
        <span class="s-title">Hidden Gems</span>
        <span class="s-desc">Off-the-beaten-path spots</span>
      </button>
    </div>

  </div>

  <div class="input-row">
    <textarea id="user-input" placeholder="Ask about places, trips, activities…" rows="1"></textarea>
    <button class="send-btn" id="send-btn" disabled>➤</button>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
  // ─── Config ────────────────────────────────────────────────────────────────

  // ⚠️ Temporary: replace with your Groq key from console.groq.com
  const GROQ_MODEL   = 'llama-3.3-70b-versatile';
  const STORAGE_KEY  = 'nomad_chat_history';

  const firebaseConfig = {
    apiKey: "AIzaSyD7_JcaiWu0nOTSwIwPkPaoYprh_YNXryc",
    authDomain: "ptv-data-25e29.firebaseapp.com",
    projectId: "ptv-data-25e29",
    storageBucket: "ptv-data-25e29.firebasestorage.app",
    messagingSenderId: "955391224203",
    appId: "1:955391224203:web:4b62267d8404647a90678e"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // ─── State ─────────────────────────────────────────────────────────────────

  let userLat = null, userLon = null;
  let allPlaces = [];
  let conversationHistory = [];

  const chat    = document.getElementById('chat');
  const input   = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const locBar  = document.getElementById('loc-bar');
  const locText = document.getElementById('loc-text');

  // ─── Init ──────────────────────────────────────────────────────────────────

  (async function init() {
    const draft = localStorage.getItem('nomad_draft');
    if (draft) { input.value = draft; sendBtn.disabled = false; }
    await loadPlaces();
    loadHistory();
    getLocation();
  })();

  // ─── Firebase ──────────────────────────────────────────────────────────────

  async function loadPlaces() {
    try {
      const snap = await db.collection('places').get();
      allPlaces = snap.docs.map(d => d.data());
      console.log(`✅ Loaded ${allPlaces.length} places`);
    } catch (e) {
      console.error('Firestore error:', e);
    }
  }

  // ─── Location ──────────────────────────────────────────────────────────────

  function getLocation() {
    if (!navigator.geolocation) {
      locText.textContent = 'Location unavailable';
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => {
        userLat = pos.coords.latitude;
        userLon = pos.coords.longitude;
        locText.textContent = `${userLat.toFixed(4)}, ${userLon.toFixed(4)}`;
        locBar.classList.add('active');
      },
      () => { locText.textContent = 'Location access denied'; }
    );
  }

  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371, d2r = Math.PI / 180;
    const dLat = (lat2 - lat1) * d2r;
    const dLon = (lon2 - lon1) * d2r;
    const a = Math.sin(dLat/2)**2 +
              Math.cos(lat1*d2r) * Math.cos(lat2*d2r) * Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function nearbyPlaces(maxKm = 100) {
    if (!userLat || !userLon) return [];
    return allPlaces
      .map(p => ({ ...p, _dist: haversine(userLat, userLon, +p.Latitude, +p.Longitude) }))
      .filter(p => p._dist <= maxKm)
      .sort((a, b) => a._dist - b._dist);
  }

  // ─── Groq API — direct call ────────────────────────────────────────────────

  const SYSTEM_PROMPT = `You are Nomad, The P2V AI Travel Assistant.

You are an intelligent travel guide, not just a database search tool.

RESPONSIBILITIES:
- Recommend nearby attractions, activities, food, nightlife, shopping, nature spots, culture, and entertainment
- Create itineraries and suggest hidden gems
- Use real-world travel knowledge alongside The P2V database

RULES:
- Do NOT limit recommendations only to provided database places
- Recommend famous or relevant places outside the database when helpful
- Prioritize answering the user's actual intent naturally
- Add local insights and practical travel suggestions

STRICT FORMAT (follow exactly):
- Use ## for section headings
- Use * for bullet points
- Use **bold** for place names and key highlights
- Short paragraphs only (2-3 sentences max)
- Never use numbered lists
- Never use markdown tables or code blocks
- Never use nested bullets
- Maximum 5 bullets per section
- Keep responses compact and mobile-friendly

Avoid sounding robotic, repeating places, or generating walls of text.`;

  async function askGroq(userMessage) {

    const nearby = nearbyPlaces(100).slice(0, 10).map(p => ({
      name: p.Name,
      slug: p.slug,
      lat: p.Latitude,
      lon: p.Longitude,
      popularity: p.Popularity,
      region: p.CountryState,
      distance: `${p._dist.toFixed(1)} km`
    }));

    const userPrompt =
      `USER QUESTION: ${userMessage}\n\n` +
      `USER LOCATION: ${
        userLat && userLon
          ? `${userLat.toFixed(4)}, ${userLon.toFixed(4)}`
          : 'unknown'
      }\n\n` +
      `Nearby places:\n${JSON.stringify(nearby)}`;

    const messages = [
      { role: 'system', content: SYSTEM_PROMPT },
      ...conversationHistory.slice(-6),
      { role: 'user', content: userPrompt }
    ];

    const res = await fetch('/.netlify/functions/chat', {

      method: 'POST',

      headers: {
        'Content-Type': 'application/json'
      },

      body: JSON.stringify({
        messages
      })
    });

    if (!res.ok) {
      throw new Error('AI request failed');
    }

    const data = await res.json();

    return data?.choices?.[0]?.message?.content
      || 'No response.';
  }

  // ─── Message Formatting ────────────────────────────────────────────────────

  function formatMessage(raw) {
    if (!raw) return '';

    let text = injectLinks(raw);
    const lines = text.split('\n');
    const out = [];
    let inUL = false, inOL = false, listItems = [];

    function flushList() {
      if (!listItems.length) return;
      if (inUL) out.push(`<ul>${listItems.map(i => `<li>${i}</li>`).join('')}</ul>`);
      if (inOL) out.push(`<ol>${listItems.map(i => `<li>${i}</li>`).join('')}</ol>`);
      listItems = []; inUL = false; inOL = false;
    }

    function inline(s) {
      return s
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/(?<!\*)\*(?!\*)(.*?)(?<!\*)\*(?!\*)/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code>$1</code>');
    }

    for (const raw of lines) {
      const line = raw.trimEnd();

      if (!line.trim()) { flushList(); continue; }

      if (/^#{2,3}\s/.test(line)) {
        flushList();
        out.push(`<h3>${inline(line.replace(/^#{2,3}\s*/, ''))}</h3>`);
        continue;
      }

      if (/^[*\-]\s/.test(line)) {
        if (inOL) flushList();
        inUL = true;
        listItems.push(inline(line.replace(/^[*\-]\s*/, '')));
        continue;
      }

      const num = line.match(/^(\d+)\.\s+(.*)/);
      if (num) {
        if (inUL) flushList();
        inOL = true;
        listItems.push(inline(num[2]));
        continue;
      }

      flushList();
      out.push(`<p>${inline(line)}</p>`);
    }

    flushList();
    return out.join('');
  }

  function injectLinks(text) {
    if (!text || !allPlaces.length) return text;

    const saved = [];
    text = text.replace(/<a\b[^>]*>.*?<\/a>/gi, m => { saved.push(m); return `%%L${saved.length-1}%%`; });

    allPlaces.forEach(p => {
      if (!p.Name || !p.slug || !p.Latitude || !p.Longitude) return;
      const esc = p.Name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re  = new RegExp(`(?<=[\\s>(*"']|^)(${esc})(?=[\\s<).,!?:;"']|$)`, 'gi');
      const url = `/?place=${encodeURIComponent(p.slug)}&lat=${encodeURIComponent(p.Latitude)}&lon=${encodeURIComponent(p.Longitude)}`;
      text = text.replace(re, `<a class="place-link" href="${url}">$1</a>`);
    });

    return text.replace(/%%L(\d+)%%/g, (_, i) => saved[+i]);
  }

  // ─── Chat Rendering ────────────────────────────────────────────────────────

  function addMessage(content, isUser) {
    const div = document.createElement('div');
    div.className = `msg ${isUser ? 'user' : 'assistant'}`;

    if (isUser) {
      div.innerHTML = `
        <div class="avatar">👤</div>
        <div class="msg-wrap">
          <div class="bubble">${escHtml(content)}</div>
        </div>`;
    } else {
      div.innerHTML = `
        <div class="avatar">🧭</div>
        <div class="msg-wrap">
          <div class="bubble">${formatMessage(content)}</div>
          <button class="copy-btn">⧉ Copy</button>
        </div>`;

      div.querySelector('.copy-btn').addEventListener('click', async function () {
        try {
          await navigator.clipboard.writeText(content);
          this.textContent = '✓ Copied';
          setTimeout(() => this.textContent = '⧉ Copy', 1500);
        } catch {}
      });
    }

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'msg assistant';
    div.id = 'typing';
    div.innerHTML = `
      <div class="avatar">🧭</div>
      <div class="msg-wrap">
        <div class="bubble">
          <div class="typing"><span></span><span></span><span></span></div>
        </div>
      </div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() { document.getElementById('typing')?.remove(); }

  function addError(msg) {
    const div = document.createElement('div');
    div.className = 'error-msg';
    div.textContent = msg;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ─── History ───────────────────────────────────────────────────────────────

  function saveHistory() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(conversationHistory));
  }

  function loadHistory() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (!Array.isArray(saved) || !saved.length) return;
      conversationHistory = saved;
      document.getElementById('starters')?.remove();
      saved.forEach(m => addMessage(m.content, m.role === 'user'));
    } catch {}
  }

  // ─── Send ──────────────────────────────────────────────────────────────────

  async function handleSend() {
    const text = input.value.trim();
    if (!text) return;

    document.getElementById('starters')?.remove();

    addMessage(text, true);
    conversationHistory.push({ role: 'user', content: text });
    saveHistory();

    input.value = '';
    input.style.height = 'auto';
    localStorage.removeItem('nomad_draft');
    sendBtn.disabled = true;

    addTyping();

    try {
      const reply = await askGroq(text);
      removeTyping();
      addMessage(reply, false);
      conversationHistory.push({ role: 'assistant', content: reply });
      saveHistory();
    } catch (err) {
      removeTyping();
      console.error(err);
      addError(`Error: ${err.message}`);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  // ─── Events ────────────────────────────────────────────────────────────────

  sendBtn.addEventListener('click', handleSend);

  input.addEventListener('input', () => {
    sendBtn.disabled = !input.value.trim();
    input.style.height = 'auto';
    input.style.height = input.scrollHeight + 'px';
    localStorage.setItem('nomad_draft', input.value);
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
  });

  document.querySelectorAll('.starter').forEach(btn => {
    btn.addEventListener('click', () => {
      input.value = btn.dataset.prompt;
      sendBtn.disabled = false;
      handleSend();
    });
  });

  document.getElementById('clear-btn').addEventListener('click', () => {
    if (!confirm('Clear this conversation?')) return;
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  });

  window.addEventListener('beforeunload', e => {
    if (conversationHistory.length > 0 && !localStorage.getItem(STORAGE_KEY)) {
      e.preventDefault();
      e.returnValue = '';
    }
  });
</script>

</body>
</html>
