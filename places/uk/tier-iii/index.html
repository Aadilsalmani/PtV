<script>
(function(){



  document.querySelectorAll(".pop-filter").forEach(cb => {
    cb.addEventListener("change", applyFilters);
  });


  const popCheckboxes = () =>
    Array.from(document.querySelectorAll(".pop-filter:checked"))
        .map(cb => cb.value);



  function getCountryDisplay(raw) {
    if (!raw) return "";

    const m = raw.match(/(([^)]+))$/);
    if (m) return m[1].trim();

    // fallback: single-word country names
    if (!raw.includes(" ") && raw[0] === raw[0].toUpperCase()) {
      return raw;
    }

    return "";
  }

  function getRegionDisplay(raw) {
    if (!raw) return "";

    const m = raw.match(/^(.+?)s*\(/);
    if (m) return m[1].trim();

    // Goa, Bihar, Sikkim etc.
    if (!raw.includes("(") && raw.length < 30) {
      return raw
        .replace(/-/g, " ")
        .replace(/w/g, c => c.toUpperCase());
    }

    return "";
  }




  function slugify(str = "") {
    return str
      .toString()
      .normalize("NFD")
      .replace(/[̀-ͯ]/g, "")
      .toLowerCase()
      .trim()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
  }

  document.body.classList.add('places-page');
  document.getElementById("page-loader")?.remove();

  const headingEl = document.getElementById("places-heading");
  if (headingEl) {
    headingEl.textContent = document.title.replace(" — The P2V", "");
  }


  let currentSort = "alpha"; // "alpha" | "distance"
  let userLocation = null;


  const sortSelect = document.getElementById("sort-mode");
  const filterBtn = document.getElementById("filter-btn");
  const filtersPanel = document.getElementById("filters-panel");

  if (filterBtn && filtersPanel) {
    filterBtn.addEventListener("click", () => {
      filtersPanel.classList.toggle("hidden");
    });
  }





  

  if (sortSelect) {
    sortSelect.addEventListener("change", () => {
      currentSort = sortSelect.value;   // 🔴 this was missing
      applyFilters();
    });
  }



  const previewEl = document.getElementById("countries-preview");
  const fullEl = document.getElementById("countries-full");
  const toggleBtn = document.getElementById("toggle-countries");

  const countriesEl = document.getElementById('countries-list');

  // Clear preview first
  previewEl.innerHTML = "";

  // ---- ALL PLACES (always first & highlighted) ----
  const allLink = document.createElement("a");
  allLink.href = "/places/";
  allLink.textContent = "All Places";
  allLink.className = "active-country";
  
  const TOP_COUNTRIES = [
    "India",
    "France",
    "Spain",
    "USA",
    "China",
    "Turkey",
    "Italy",
    "Mexico",
    "Hong Kong",
    "UK",
    "Germany"
  ];

  // Build countries list
  const countriesArray = window.P2V_ALL_COUNTRIES || (function () {
    const map = {};

    allPlaces.forEach(p => {
      if (!p.__countrySlug) return;

      map[p.__countrySlug] = map[p.__countrySlug] || {
        name: p.__country,
        count: 0
      };

      map[p.__countrySlug].count++;
    });

    return Object.keys(map)
      .sort()
      .map(k => ({
        slug: k,
        name: map[k].name,
        count: map[k].count
      }));
  })();

  previewEl.innerHTML = "";
  fullEl.innerHTML = "";

  // All Places button
  allLink.href = "/places/";
  allLink.textContent = "All Places";
  allLink.className = "active-country";
  previewEl.appendChild(allLink);

  // Top countries
  TOP_COUNTRIES.forEach(name => {
    const c = countriesArray.find(x => x.name === name);
    if (!c) return;

    const link = document.createElement("a");
    link.href = "/places/" + c.slug;
    link.textContent = c.name + " (" + c.count + ")";

    previewEl.appendChild(link);
  });

  toggleBtn.addEventListener("click", () => {
    fullEl.classList.toggle("hidden");

    toggleBtn.textContent = fullEl.classList.contains("hidden")
      ? "Show all countries"
      : "Hide countries";
  });

  // Remaining countries
  countriesArray.forEach(c => {
    if (TOP_COUNTRIES.includes(c.name)) return;

    const link = document.createElement("a");
    link.href = "/places/" + c.slug;
    link.textContent = c.name + " (" + c.count + ")";

    fullEl.appendChild(link);
  });
  const listEl = document.getElementById('places-list');
  const countText = document.getElementById('count-text');
  const searchInput = document.getElementById('search-input');


  function renderList(places){
    listEl.innerHTML = '';
    if(!places.length){ listEl.innerHTML = '<div class="empty-state">No places matched your filters.</div>'; countText.textContent = '0 places found.'; return; }
    places.slice(0,3000).forEach(p=>{
      const row = document.createElement('a'); row.className='place-row';
      const slug = p.slug || (p.Name||'').toString().toLowerCase().replace(/s+/g,'-').replace(/[^a-z0-9-]/gi,'');
      row.href = '/place/' + encodeURIComponent(slug) + '/';
      const main = document.createElement('div'); main.className='place-main';
      const nameEl = document.createElement('div'); nameEl.className='place-name'; nameEl.textContent = p.Name || '(Unnamed place)'; main.appendChild(nameEl);
      const meta = document.createElement('div'); meta.className='place-meta';
      const locationText = p.CountryState || "";
      const locationLink = p.__regionUrlSlug
        ? '/places/' + p.__countryUrlSlug + '/' + p.__regionUrlSlug + '/'
        : '/places/' + p.__countryUrlSlug + '/';


      if (locationText) {
        const link = document.createElement("a");
        link.href = locationLink;
        link.textContent = locationText;   // 👈 FULL VALUE, untouched
        meta.appendChild(link);
      }



      main.appendChild(meta);
      const right = document.createElement('div');
      const tag = document.createElement('div'); tag.className='place-tag';
      const pop = p.Popularity || 'Listed';
      const tierSlug = (pop||'').toString().toLowerCase().trim().replace(/s+/g,'-').replace(/[^a-z0-9-]/g,'');
      const a = document.createElement('a');
      const hasRegionUrl = p.__regionUrlSlug && p.__regionUrlSlug.length > 0;

      a.href = hasRegionUrl
        ? '/places/' + p.__countryUrlSlug + '/' + p.__regionUrlSlug + '/' + p.__tierUrlSlug
        : '/places/' + p.__countryUrlSlug + '/' + p.__tierUrlSlug;



      a.textContent = pop;
      tag.appendChild(a);
      right.appendChild(tag);
      row.appendChild(main); row.appendChild(right);
      listEl.appendChild(row);

      if (p.__dist !== undefined && p.__dist !== Infinity) {
        const dist = document.createElement("div");
        dist.className = "place-meta";
        dist.textContent = p.__dist.toFixed(1) + "km away";
        main.appendChild(dist);
      }

    });
    countText.textContent = String(places.length) + ' place' + (places.length===1?'':'s') + ' found.';
  }

  function requestLocationIfNeeded() {
    return new Promise(resolve => {
      if (!navigator.geolocation) {
        resolve(null);
        return;
      }

      navigator.geolocation.getCurrentPosition(
        pos => resolve(pos.coords),
        () => resolve(null),
        { timeout: 6000 }
      );
    });
  }

  const allPlaces = (window.P2V_PLACES || []).map(p => {
    const raw = (p.CountryState || "").toString().trim();

    let country = "";
    let region = "";

    // ✅ Only treat parentheses as region IF country is known inside ()
    const match = raw.match(/^(.+?)s*((India|Australia))$/i)


    if (match) {
      region  = match[1].trim();   // Tamil Nadu / New South Wales
      country = match[2].trim();   // India / Australia
    } else {
      country = raw;               // Bosnia & Herzegovina, France, Japan
      region = "";
    }

    return {
      ...p,
      __country: country,
      __region: region,
      __countrySlug: slugify(country),
      __regionSlug: slugify(region)
    };
  });

  window.__DEBUG_allPlaces =  allPlaces;

  async function applyFilters() {



    const q = (searchInput.value || "").trim().toLowerCase();
    let filtered = allPlaces.slice();


    const selectedPops = popCheckboxes();

    if (selectedPops.length) {
      filtered = filtered.filter(p =>
        selectedPops.includes(p.Popularity)
      );
    }



    



    if (q) {
      filtered = filtered.filter(p =>
        ((p.Name || "") + " " + (p.CountryState || "")).toLowerCase().includes(q)
      );
    }

    if (currentSort === "distance") {
      if (!userLocation) {
        userLocation = await requestLocationIfNeeded();
      }

      if (!userLocation) {
        showInlineNotice("Enable location to sort by distance.");
        currentSort = "alpha";
        sortSelect.value = "alpha";
      } else {
        filtered.forEach(p => {
          if (p.Latitude && p.Longitude) {
            p.__dist = haversine(
              userLocation.latitude,
              userLocation.longitude,
              parseFloat(p.Latitude),
              parseFloat(p.Longitude)
            );
          } else {
            p.__dist = Infinity;
          }
        });

        filtered.sort((a, b) => a.__dist - b.__dist);
        renderList(filtered);
        return;
      }
    }

    filtered.sort((a, b) =>
      (a.Name || "").localeCompare(b.Name || "")
    );





    renderList(filtered);
  }




  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a =
      Math.sin(dLat/2)**2 +
      Math.cos(lat1*Math.PI/180) *
      Math.cos(lat2*Math.PI/180) *
      Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }



  function showInlineNotice(msg) {
    const el = document.getElementById("inline-notice");
    if (!el) return;
    el.textContent = msg;
    el.classList.remove("hidden");
    setTimeout(() => el.classList.add("hidden"), 4000);
  }



  requestIdleCallback(() => {
    searchInput.addEventListener('input', ()=>{
      setTimeout(applyFilters, 150);
    });
    applyFilters();
  });


 
 

  const countryToggle = document.getElementById("toggle-country-panel");
  const countryPanel  = document.getElementById("country-panel");

  if (countryToggle && countryPanel) {
    countryToggle.addEventListener("click", () => {
      countryPanel.classList.toggle("hidden");

      countryToggle.textContent = countryPanel.classList.contains("hidden")
        ? "🌍 Explore by country"
        : "✖ Hide countries";
    });
  }


})();   // ✅ ONLY ONE CLOSE
</script>
</body>
