,"name":"Italy","count":18},{"slug":"jamaica","name":"Jamaica","count":1},{"slug":"japan","name":"Japan","count":61},{"slug":"jordan","name":"Jordan","count":3},{"slug":"kazakhstan","name":"Kazakhstan","count":7},{"slug":"kenya","name":"Kenya","count":3},{"slug":"latvia","name":"Latvia","count":2},{"slug":"lebanon","name":"Lebanon","count":1},{"slug":"lithuania","name":"Lithuania","count":1},{"slug":"madagascar","name":"Madagascar","count":1},{"slug":"malaysia","name":"Malaysia","count":3},{"slug":"maldives","name":"Maldives","count":2},{"slug":"mexico","name":"Mexico","count":9},{"slug":"montenegro","name":"Montenegro","count":1},{"slug":"morocco","name":"Morocco","count":5},{"slug":"myanmar","name":"Myanmar","count":2},{"slug":"nepal","name":"Nepal","count":6},{"slug":"netherlands","name":"Netherlands","count":15},{"slug":"new-hampshire-usa","name":"New Hampshire, USA","count":1},{"slug":"new-zealand","name":"New Zealand","count":16},{"slug":"nigeria","name":"Nigeria","count":1},{"slug":"north-macedonia","name":"North Macedonia","count":2},{"slug":"northern-ireland","name":"Northern Ireland","count":1},{"slug":"norway","name":"Norway","count":6},{"slug":"oman","name":"Oman","count":1},{"slug":"pakistan","name":"Pakistan","count":43},{"slug":"palestine","name":"Palestine","count":2},{"slug":"peru","name":"Peru","count":4},{"slug":"poland","name":"Poland","count":2},{"slug":"pondicherry","name":"Pondicherry","count":10},{"slug":"portugal","name":"Portugal","count":14},{"slug":"portuguese","name":"Portuguese","count":1},{"slug":"puerto-rico","name":"Puerto Rico","count":3},{"slug":"romania","name":"Romania","count":3},{"slug":"russia","name":"Russia","count":39},{"slug":"saudi-arabia","name":"Saudi Arabia","count":3},{"slug":"senegal","name":"Senegal","count":1},{"slug":"serbia","name":"Serbia","count":1},{"slug":"slovenia","name":"Slovenia","count":2},{"slug":"south-africa","name":"South Africa","count":2},{"slug":"south-korea","name":"South Korea","count":39},{"slug":"spain","name":"Spain","count":14},{"slug":"sri-lanka","name":"Sri Lanka","count":22},{"slug":"sumatra","name":"Sumatra","count":1},{"slug":"sweden","name":"Sweden","count":3},{"slug":"switzerland","name":"Switzerland","count":23},{"slug":"tanzania","name":"Tanzania","count":1},{"slug":"thailand","name":"Thailand","count":16},{"slug":"turkey","name":"Turkey","count":8},{"slug":"uae","name":"UAE","count":14},{"slug":"uk","name":"UK","count":91},{"slug":"ukraine","name":"Ukraine","count":2},{"slug":"usa","name":"USA","count":90},{"slug":"uzbekistan","name":"Uzbekistan","count":3},{"slug":"vetican-city","name":"Vetican City","count":2},{"slug":"vietnam","name":"Vietnam","count":2},{"slug":"yemen","name":"Yemen","count":1}];
        </script>

<script>
(function(){


  function getCountryDisplay(raw) {
    if (!raw) return "";

    const m = raw.match(/(([^)]+))$/);
    if (m) return m[1].trim();

    // fallback: single-word country names
    if (!raw.includes(" ") && raw[0] === raw[0].toUpperCase()) {
      return raw;
    }

    return "";
  }

  function getRegionDisplay(raw) {
    if (!raw) return "";

    const m = raw.match(/^(.+?)s*\(/);
    if (m) return m[1].trim();

    // Goa, Bihar, Sikkim etc.
    if (!raw.includes("(") && raw.length < 30) {
      return raw
        .replace(/-/g, " ")
        .replace(/w/g, c => c.toUpperCase());
    }

    return "";
  }




  function slugify(str = "") {
    return str
      .toString()
      .normalize("NFD")
      .replace(/[̀-ͯ]/g, "")
      .toLowerCase()
      .trim()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
  }

  document.body.classList.add('places-page');
  document.getElementById("page-loader")?.remove();

  let currentLetter = "All";
  let currentSort = "alpha"; // "alpha" | "distance"
  let userLocation = null;


  const sortSelect = document.getElementById("sort-mode");
  const filterBtn = document.getElementById("filter-btn");
  const filtersPanel = document.getElementById("filters-panel");

  if (filterBtn && filtersPanel) {
    filterBtn.addEventListener("click", () => {
      filtersPanel.classList.toggle("hidden");
    });
  }


  const tierSelect = document.getElementById("filter-tier");
  const countrySelect = document.getElementById("filter-country");




  

  if (sortSelect) {
    sortSelect.addEventListener("change", () => {
      currentSort = sortSelect.value;   // 🔴 this was missing
      applyFilters();
    });
  }

  tierSelect?.addEventListener("change", applyFilters);
  countrySelect?.addEventListener("change", applyFilters);



  const previewEl = document.getElementById("countries-preview");
  const fullEl = document.getElementById("countries-full");
  const toggleBtn = document.getElementById("toggle-countries");

  const countriesEl = document.getElementById('countries-list');

  // Clear preview first
  previewEl.innerHTML = "";

  // ---- ALL PLACES (always first & highlighted) ----
  const allLink = document.createElement("a");
  allLink.href = "/places/";
  allLink.textContent = "All Places";
  allLink.className = "active-country";
  
  // ---- TOP COUNTRIES AFTER ALL PLACES ----
  const TOP_COUNTRIES = ["India", "France", "Italy", "USA", "Japan"];


   
  // Build countries list: prefer global countries provided by generator
  const countriesArray = window.P2V_ALL_COUNTRIES || (function(){
    const map = {};
    allPlaces.forEach(p=>{
      if(!p.__countrySlug) return;
      map[p.__countrySlug] = map[p.__countrySlug] || { name: p.__country, count: 0 };
      map[p.__countrySlug].count++;
    });
    return Object.keys(map).sort().map(k=>({ slug:k, name: map[k].name, count: map[k].count }));
  })();



  countrySelect.innerHTML = '<option value="">All countries</option>';

  if (countrySelect) {
    countriesArray.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c.slug;
      opt.textContent = c.name + " (" + c.count + ")";
      countrySelect.appendChild(opt);
    });
  }



 
  allLink.href = "/places/";
  allLink.textContent = "All Places";
  previewEl.appendChild(allLink);

  if(countriesEl){
    
    countriesEl.innerHTML = '';
    countriesArray.forEach(c=>{
      const a = document.createElement('a');
      a.href = '/places/' + c.slug;
      a.textContent = c.name + ' (' + c.count + ')';
      a.style.display='inline-block'; a.style.margin='6px 10px'; a.style.color='#007a7a';
      countriesEl.appendChild(a);
    });
  }


  TOP_COUNTRIES.forEach(name => {
    const c = countriesArray.find(x => x.name === name);
    if (!c) return;

    const link = document.createElement("a");
    link.href = "/places/" + c.slug;
    link.textContent = c.name + " (" + c.count + ")";
    previewEl.appendChild(link);
  });

  const alphaBar = document.getElementById('alpha-bar');
  const listEl = document.getElementById('places-list');
  const countText = document.getElementById('count-text');
  const searchInput = document.getElementById('search-input');

  function buildAlpha(){
    const letters = ['All'];
    for(let i=65;i<=90;i++) letters.push(String.fromCharCode(i));
    letters.forEach(letter=>{
      const chip = document.createElement('button');
      chip.type='button';
      chip.className='alpha-chip' + (letter==='All'?' active':'');
      chip.textContent = letter;
      chip.addEventListener('click', ()=>{ currentLetter = letter; document.querySelectorAll('.alpha-chip').forEach(c=>c.classList.remove('active')); chip.classList.add('active'); applyFilters(); });
      alphaBar.appendChild(chip);
    });
  }

  function renderList(places){
    listEl.innerHTML = '';
    if(!places.length){ listEl.innerHTML = '<div class="empty-state">No places matched your filters.</div>'; countText.textContent = '0 places found.'; return; }
    places.slice(0,3000).forEach(p=>{
      const row = document.createElement('a'); row.className='place-row';
      const slug = p.slug || (p.Name||'').toString().toLowerCase().replace(/s+/g,'-').replace(/[^a-z0-9-]/gi,'');
      row.href = '/place/' + encodeURIComponent(slug) + '/';
      const main = document.createElement('div'); main.className='place-main';
      const nameEl = document.createElement('div'); nameEl.className='place-name'; nameEl.textContent = p.Name || '(Unnamed place)'; main.appendChild(nameEl);
      const meta = document.createElement('div'); meta.className='place-meta';
      const regionLabel = getRegionDisplay(p.CountryState);
      const countryLabel = getCountryDisplay(p.CountryState);

      if (p.__regionUrlSlug && regionLabel) {
        const rLink = document.createElement('a');
        rLink.href = '/places/' + p.__countryUrlSlug + '/' + p.__regionUrlSlug + '/';
        rLink.textContent = regionLabel;
        rLink.style.color = '#007a7a';
        rLink.style.textDecoration = 'none';
        meta.appendChild(rLink);

      } else if (p.__countryUrlSlug && countryLabel) {
        const cLink = document.createElement('a');
        cLink.href = '/places/' + p.__countryUrlSlug + '/';
        cLink.textContent = countryLabel;
        cLink.style.color = '#007a7a';
        cLink.style.textDecoration = 'none';
        meta.appendChild(cLink);
      }


      main.appendChild(meta);
      const right = document.createElement('div');
      const tag = document.createElement('div'); tag.className='place-tag';
      const pop = p.Popularity || 'Listed';
      const tierSlug = (pop||'').toString().toLowerCase().trim().replace(/s+/g,'-').replace(/[^a-z0-9-]/g,'');
      const a = document.createElement('a');
      const hasRegionUrl = p.__regionUrlSlug && p.__regionUrlSlug.length > 0;

      a.href = hasRegionUrl
        ? '/places/' + p.__countryUrlSlug + '/' + p.__regionUrlSlug + '/' + p.__tierUrlSlug
        : '/places/' + p.__countryUrlSlug + '/' + p.__tierUrlSlug;



      a.textContent = pop;
      a.style = 'color:#007a7a;text-decoration:none;font-weight:700';
      tag.appendChild(a);
      right.appendChild(tag);
      row.appendChild(main); row.appendChild(right);
      listEl.appendChild(row);

      if (p.__dist !== undefined && p.__dist !== Infinity) {
        const dist = document.createElement("div");
        dist.className = "place-meta";
        dist.textContent = p.__dist.toFixed(1) + "km away";
        main.appendChild(dist);
      }

    });
    countText.textContent = String(places.length) + ' place' + (places.length===1?'':'s') + ' found.';
  }

  function requestLocationIfNeeded() {
    return new Promise(resolve => {
      if (!navigator.geolocation) {
        resolve(null);
        return;
      }

      navigator.geolocation.getCurrentPosition(
        pos => resolve(pos.coords),
        () => resolve(null),
        { timeout: 6000 }
      );
    });
  }

  const allPlaces = (window.P2V_PLACES || []).map(p => {
    const raw = (p.CountryState || "").toString().trim();

    let country = "";
    let region = "";

    // ✅ Only treat parentheses as region IF country is known inside ()
    const match = raw.match(/^(.+?)s*((India|Australia))$/i)


    if (match) {
      region  = match[1].trim();   // Tamil Nadu / New South Wales
      country = match[2].trim();   // India / Australia
    } else {
      country = raw;               // Bosnia & Herzegovina, France, Japan
      region = "";
    }

    return {
      ...p,
      __country: country,
      __region: region,
      __countrySlug: slugify(country),
      __regionSlug: slugify(region)
    };
  });

  window.__DEBUG_allPlaces =  allPlaces;

  async function applyFilters() {

    const tierVal = tierSelect?.value || "";
    const countryVal = countrySelect?.value || "";



    const q = (searchInput.value || "").trim().toLowerCase();
    let filtered = allPlaces.slice();


    if (tierVal) {
      filtered = filtered.filter(p => p.Popularity === tierVal);
    }

    if (countryVal) {
      filtered = filtered.filter(
        p => p.__countrySlug === countryVal
      );
    }
    


    if (currentLetter !== "All") {
      filtered = filtered.filter(p =>
        (p.Name || "").toUpperCase().startsWith(currentLetter)
      );
    }

    if (q) {
      filtered = filtered.filter(p =>
        ((p.Name || "") + " " + (p.CountryState || "")).toLowerCase().includes(q)
      );
    }

    if (currentSort === "distance") {
      if (!userLocation) {
        userLocation = await requestLocationIfNeeded();
      }

      if (!userLocation) {
        showInlineNotice("Enable location to sort by distance.");
        currentSort = "alpha";
        sortSelect.value = "alpha";
      } else {
        filtered.forEach(p => {
          if (p.Latitude && p.Longitude) {
            p.__dist = haversine(
              userLocation.latitude,
              userLocation.longitude,
              parseFloat(p.Latitude),
              parseFloat(p.Longitude)
            );
          } else {
            p.__dist = Infinity;
          }
        });

        filtered.sort((a, b) => a.__dist - b.__dist);
        renderList(filtered);
        return;
      }
    }

    filtered.sort((a, b) =>
      (a.Name || "").localeCompare(b.Name || "")
    );

    renderList(filtered);
  }




  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a =
      Math.sin(dLat/2)**2 +
      Math.cos(lat1*Math.PI/180) *
      Math.cos(lat2*Math.PI/180) *
      Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }



  function showInlineNotice(msg) {
    const el = document.getElementById("inline-notice");
    if (!el) return;
    el.textContent = msg;
    el.classList.remove("hidden");
    setTimeout(() => el.classList.add("hidden"), 4000);
  }



  requestIdleCallback(() => {
    buildAlpha();
    searchInput.addEventListener('input', ()=>{ setTimeout(applyFilters, 150); });
    applyFilters();
  });

 
 if (previewEl && fullEl && toggleBtn) {
    const previewCount = 8;

    countriesArray.forEach((c, i) => {
      const link = document.createElement("a");
      link.href = "/places/" + c.slug;
      link.textContent = c.name + " (" + c.count + ")";

      if (i < previewCount) {
        previewEl.appendChild(link);
      } else {
        fullEl.appendChild(link);
      }
    });

    toggleBtn.addEventListener("click", () => {
      fullEl.classList.toggle("hidden");
      toggleBtn.textContent = fullEl.classList.contains("hidden")
        ? "Show all countries"
        : "Hide countries";
    });
  }

})();   // ✅ ONLY ONE CLOSE
</script>
</body>
</html>
