<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ainment</title>

    <meta
        name="description"
        content="AI-powered movie and TV series recommendation platform."
    >

    <link rel="stylesheet" href="styles.css">

</head>
<body>

    <!-- ===========================
            HEADER
    ============================ -->

    <header>

        <div class="logo">

            <h2>Ainment</h2>

        </div>

    </header>



    <!-- ===========================
            HERO
    ============================ -->

    <main>

        <section class="hero">

            <div class="hero-content">

                <h1>
                    Find your next favorite
                    <span>movie or series.</span>
                </h1>

                <p class="subtitle">

                    Describe exactly what you're in the mood to watch.
                    Ainment's AI will recommend movies and TV series
                    tailored just for you.

                </p>

            </div>



            <!-- ======================
                    AI INPUT
            ======================= -->

            <section class="ai-box">

                <label for="prompt">

                    What are you in the mood to watch today?

                </label>

                <textarea
                    id="prompt"
                    placeholder="Example: A mind-bending sci-fi movie with an emotional ending..."
                ></textarea>

            </section>



            <!-- ======================
                    OPTIONAL FILTERS
            ======================= -->

            <section class="filters">

                <h3>Optional Filters</h3>

                <div class="filter-grid">

                    <select>
                        <option>Movies & TV Series</option>
                        <option>Movies</option>
                        <option>TV Series</option>
                    </select>

                    <select>
                        <option>Any Genre</option>
                    </select>

                    <select>
                        <option>Any Mood</option>
                    </select>

                    <select>
                        <option>Any Runtime</option>
                    </select>

                    <select>
                        <option>Any Language</option>
                    </select>

                    <select>
                        <option>Any Release Year</option>
                    </select>

                </div>

            </section>



            <!-- ======================
                    BUTTON
            ======================= -->

            <section class="action">

                <button id="recommendButton">

                    🎬 Find My Next Watch

                </button>

            </section>

        </section>



        <!-- ===========================
                LOADING
        ============================ -->

        <section
            id="loadingSection"
            hidden
        >

            <h2>Finding the perfect recommendations...</h2>

        </section>



        <!-- ===========================
                RESULTS
        ============================ -->

        <section
            id="resultsSection"
            hidden
        >

            <h2>Recommended for You</h2>

            <div id="resultsGrid">

            </div>

        </section>

    </main>



    <!-- ===========================
            FOOTER
    ============================ -->

    <footer>

        <p>

            © 2026 Ainment

        </p>

    </footer>



    <script src="app.js"></script>

</body>
</html>
